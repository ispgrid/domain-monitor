; PHP settings for the Docker image

; Container environment variables (DB_*, DOCKER) must reach $_ENV
variables_order = "EGPCS"

expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED

memory_limit = 512M
max_execution_time = 300
max_input_time = 300
max_input_vars = 3000
post_max_size = 32M
upload_max_filesize = 16M
default_socket_timeout = 120

; The app uses the timezone from Settings → Application
date.timezone = UTC

opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 60
