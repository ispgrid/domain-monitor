ServerName localhost
ServerTokens Prod
ServerSignature Off

<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Errors go to the /data volume for Logs → Container; the entrypoint also forwards
    # them to docker logs. Requests are logged to docker logs only, unless
    # ACCESS_LOG_FILE=true adds the file as well.
    ErrorLog /data/logs/container-apache-error.log
    CustomLog /proc/self/fd/1 combined

    # Written by the entrypoint from ACCESS_LOG_FILE and TRUSTED_PROXIES
    IncludeOptional /etc/apache2/domain-monitor/*.conf
</VirtualHost>
